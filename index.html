<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말하는 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* 레이아웃: 상단 탭(기록/통계) 하나, 데스크톱에서는 입력 | 목록 두 칼럼, 폰에서는 한 칼럼 */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --line:#dfe4e0; --fg:#18201c; --muted:#5f6b65;
  --accent:#1f6f5c; --accent-soft:#e2efea; --danger:#b4412f; --up:#b4412f; --down:#1f6f5c;
  --font:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a201d; --line:#2b332f; --fg:#e7ece9; --muted:#97a39d;
  --accent:#5cc2a4; --accent-soft:#1f3a32; --danger:#ef7d69; --up:#ef7d69; --down:#5cc2a4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a201d; --line:#2b332f; --fg:#e7ece9; --muted:#97a39d;
  --accent:#5cc2a4; --accent-soft:#1f3a32; --danger:#ef7d69; --up:#ef7d69; --down:#5cc2a4; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 14px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
h2{font-size:15px;margin:0 0 12px;text-wrap:balance}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:6px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
/* 폰: 입력 → 최근 기록 → 카테고리 관리 → 백업 순서 */
@media (max-width:820px){
  .grid{display:flex;flex-direction:column;gap:14px}
  .grid > .stack{display:contents}
  #entryForm{order:1} #listPanel{order:2} #catPanel{order:3} #backupPanel{order:4}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
label{font-size:12px;color:var(--muted);letter-spacing:.03em;display:block;margin-bottom:5px}
input,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.amount-input{font-family:var(--num);font-size:22px;text-align:right}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.small{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
/* 음성 */
.voice{display:flex;gap:10px;align-items:stretch}
.mic{flex:none;width:52px;border-radius:12px;border:0;background:var(--accent);color:var(--surface);display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--danger) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.parsed{font-size:13px;background:var(--accent-soft);border-radius:9px;padding:8px 10px}
/* 카테고리 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface));font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
/* 목록 */
.day{margin-top:16px}
.day:first-child{margin-top:0}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:4px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 4px;border-radius:8px}
.item:hover{background:var(--bg)}
.item .memo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .memo small{color:var(--muted);margin-left:6px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
/* 통계 */
.statbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.period{display:flex;align-items:center;gap:6px}
.period strong{min-width:150px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--num);font-size:20px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;font-family:var(--num)}
.pill.up{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}
.pill.down{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}
.charts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.charts{grid-template-columns:minmax(0,1fr)}}
.canvas-box{position:relative;height:260px}
.share{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg);margin-bottom:12px}
.share span{background:var(--c)}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .bar{grid-column:2 / 4;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.catrow .bar i{display:block;height:100%;background:var(--c)}
.catrow .meta{font-size:12px;color:var(--muted)}
/* 달력 히트맵 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center}
.cal .cell{aspect-ratio:1/1;max-width:100%;border-radius:6px;background:var(--bg);font-size:11px;padding:3px 4px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid transparent}
.cal .cell b{font-weight:500}
.cal .cell span{font-family:var(--num);font-size:10px;text-align:right;overflow:hidden;white-space:nowrap}
.cal .cell.today{border-color:var(--fg)}
.cal .blank{background:none}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.top li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.top{list-style:none;margin:0;padding:0}
.top li:last-child{border-bottom:0}
.top small{color:var(--muted)}
/* 카테고리 관리 */
details summary{cursor:pointer;font-weight:700;font-size:15px}
.catedit{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.4fr) auto;gap:6px;align-items:center;margin-top:8px}
.catedit input[type=color]{padding:2px;height:36px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:20}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700;text-decoration:underline}
.mt{margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>말하는 가계부<small id="todayLabel"></small></h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-log" aria-selected="true">기록</button>
      <button role="tab" id="tab-stats" aria-selected="false">통계</button>
    </div>
  </header>

  <!-- 기록 -->
  <section id="view-log">
    <div class="grid">
      <div class="stack">
        <form class="panel stack" id="entryForm" autocomplete="off">
          <div>
            <label for="sentence">말하거나 한 줄로 입력하기</label>
            <div class="voice">
              <button type="button" class="mic" id="micBtn" aria-label="음성 입력 시작">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="none"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
              </button>
              <input id="sentence" placeholder="예: 배달 음식 15,000원 / 어제 택시 만이천원">
            </div>
            <p class="hint" id="micHint">마이크를 누르고 말하면 카테고리·금액·날짜를 자동으로 채웁니다. 저장 전에 확인하세요.</p>
            <div class="parsed" id="parsed" hidden></div>
          </div>
          <div>
            <label>카테고리</label>
            <div class="chips" id="catChips"></div>
          </div>
          <div>
            <label for="amount">금액 (원)</label>
            <input id="amount" class="amount-input" inputmode="numeric" placeholder="0">
          </div>
          <div class="row">
            <div style="flex:1">
              <label for="when">날짜·시간</label>
              <input id="when" type="datetime-local">
            </div>
            <button type="button" class="btn small" id="nowBtn" style="align-self:flex-end;margin-bottom:4px">지금</button>
          </div>
          <div>
            <label for="memo">메모</label>
            <input id="memo" placeholder="선택 사항">
          </div>
          <div class="row">
            <button type="submit" class="btn primary" id="saveBtn" style="flex:1">저장</button>
            <button type="button" class="btn" id="cancelEdit" hidden>수정 취소</button>
          </div>
        </form>

        <details class="panel" id="catPanel">
          <summary>카테고리 관리</summary>
          <p class="hint">키워드는 쉼표로 구분합니다. 음성/문장에 키워드가 들어가면 그 카테고리로 분류됩니다.</p>
          <div id="catList"></div>
          <div class="catedit">
            <input type="color" id="newCatColor" value="#7a5cc2" aria-label="새 카테고리 색">
            <input id="newCatName" placeholder="이름">
            <input id="newCatKw" placeholder="키워드 (쉼표)">
            <button type="button" class="btn small" id="addCat">추가</button>
          </div>
        </details>

        <div class="panel stack" id="backupPanel">
          <h2>백업</h2>
          <div class="row" style="flex-wrap:wrap">
            <button type="button" class="btn small" id="exportBtn">JSON 내보내기</button>
            <label class="btn small" style="margin:0;color:var(--fg);font-size:13px;letter-spacing:0">JSON 가져오기<input type="file" id="importFile" accept="application/json" hidden></label>
            <button type="button" class="btn small" id="sampleBtn">예시 데이터 넣기</button>
          </div>
        </div>
      </div>

      <div class="panel" id="listPanel">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <h2 style="margin:0">최근 기록</h2>
          <span class="hint" id="listSum" style="margin:0"></span>
        </div>
        <div id="list"></div>
      </div>
    </div>
  </section>

  <!-- 통계 -->
  <section id="view-stats" hidden>
    <div class="statbar">
      <div class="tabs" role="tablist" id="unitTabs">
        <button data-unit="day">1일</button>
        <button data-unit="week">1주</button>
        <button data-unit="month" aria-selected="true">1개월</button>
        <button data-unit="year">1년</button>
      </div>
      <div class="period">
        <button class="btn small" id="prevP" aria-label="이전 기간">‹</button>
        <strong id="pLabel"></strong>
        <button class="btn small" id="nextP" aria-label="다음 기간">›</button>
        <button class="btn small ghost" id="thisP">오늘</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="charts">
      <div class="panel">
        <h2 id="mainTitle"></h2>
        <div class="canvas-box"><canvas id="mainChart"></canvas></div>
      </div>
      <div class="panel">
        <h2>카테고리별</h2>
        <div id="catBreak"></div>
      </div>
      <div class="panel" id="secondPanel">
        <h2 id="secondTitle"></h2>
        <div id="secondBody"></div>
      </div>
      <div class="panel">
        <h2>큰 지출 TOP 5</h2>
        <ol class="top" id="topList"></ol>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo" hidden>되돌리기</button></div>

<script>
/* ---------- 저장소 ---------- */
const KEY = 'gagyebu.v1';
const DEFAULT_CATS = [
  {id:'food',name:'식비',color:'#e07a3f',kw:'식비,점심,저녁,아침,밥,식당,외식,마트,장보기'},
  {id:'delivery',name:'배달',color:'#d6455d',kw:'배달,배민,요기요,쿠팡이츠,치킨,피자'},
  {id:'cafe',name:'카페',color:'#9a6b46',kw:'카페,커피,스타벅스,라떼,디저트,빵'},
  {id:'transport',name:'교통',color:'#2f7fc1',kw:'교통,택시,버스,지하철,기차,주유,기름,주차'},
  {id:'shopping',name:'쇼핑',color:'#8a5cc2',kw:'쇼핑,옷,신발,쿠팡,무신사,화장품'},
  {id:'living',name:'생활',color:'#3f9a7a',kw:'생활,관리비,전기,가스,수도,통신,월세,생필품'},
  {id:'culture',name:'문화',color:'#c2a13a',kw:'영화,공연,책,넷플릭스,구독,게임,여행'},
  {id:'health',name:'의료',color:'#4bb1b8',kw:'병원,약국,약,의료,헬스,운동'},
  {id:'etc',name:'기타',color:'#7d8a84',kw:'기타'}
];
let state = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.entries)) return s; }catch(e){}
  return {cats:structuredClone(DEFAULT_CATS), entries:[]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('브라우저 저장소에 저장하지 못했습니다'); } }
const catById = id => state.cats.find(c=>c.id===id) || state.cats.find(c=>c.id==='etc') || state.cats[0];

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const shortWon = n => n>=1e8 ? (n/1e8).toFixed(1).replace(/\.0$/,'')+'억' : n>=1e4 ? (n/1e4).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'만' : Math.round(n).toLocaleString('ko-KR');
const pad = n => String(n).padStart(2,'0');
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const WD = ['일','월','화','수','목','금','토'];
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- 한국어 문장 해석 ---------- */
const DIG={영:0,공:0,일:1,이:2,삼:3,사:4,오:5,육:6,륙:6,칠:7,팔:8,구:9};
const SMALL={십:10,백:100,천:1000};
const BIG={만:1e4,억:1e8};
function koToNum(s){
  s = s.replace(/[,\s원]/g,'');
  let total=0, section=0, num=0, buf='';
  for(const ch of s){
    if(/[0-9.]/.test(ch)){ buf+=ch; continue; }
    if(buf){ num=parseFloat(buf); buf=''; }
    if(ch in DIG) num=DIG[ch];
    else if(ch in SMALL){ section += (num||1)*SMALL[ch]; num=0; }
    else if(ch in BIG){ section += num; total += (section||1)*BIG[ch]; section=0; num=0; }
  }
  if(buf) num=parseFloat(buf);
  return Math.round(total+section+num);
}
function parseSentence(text){
  let rest = ' '+text+' ';
  // 금액: '원'으로 끝나는 표현 우선, 없으면 숫자로 시작하는 표현
  let m = rest.match(/[0-9영공일이삼사오육륙칠팔구십백천만억.,\s]*[0-9영공일이삼사오육륙칠팔구십백천만억]\s*원/);
  if(!m) m = rest.match(/[0-9][0-9,.]*(?:\s*[만천백억]\s*[0-9,.]*)*/);
  let amount = 0;
  if(m){ amount = koToNum(m[0].trim()); rest = rest.replace(m[0],' '); }
  // 날짜 표현
  const now = new Date(); let date = null;
  const rel = [['그저께',-2],['그제',-2],['엊그제',-2],['어제',-1],['오늘',0]];
  for(const [w,off] of rel){ if(rest.includes(w)){ date=new Date(now); date.setDate(now.getDate()+off); rest=rest.replace(w,' '); break; } }
  const md = rest.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(md){ date=new Date(now.getFullYear(), +md[1]-1, +md[2], now.getHours(), now.getMinutes()); rest=rest.replace(md[0],' '); }
  // 카테고리: 가장 긴 키워드 매칭
  let best=null, bestLen=0;
  for(const c of state.cats){
    const words = [c.name, ...c.kw.split(',')].map(w=>w.trim()).filter(Boolean);
    for(const w of words){ if(rest.includes(w) && w.length>bestLen){ best=c; bestLen=w.length; } }
  }
  const memo = rest.replace(/\s+/g,' ').replace(/(에|로|으로)?\s*(썼어|썼음|사용|결제|지출)\S*/g,'').trim();
  return {amount, cat: best, date, memo};
}

/* ---------- 입력 폼 ---------- */
let selCat = 'delivery', editingId = null;
function renderChips(){
  if(!state.cats.some(c=>c.id===selCat)) selCat = state.cats[0]?.id;
  $('#catChips').innerHTML = state.cats.map(c=>`<button type="button" class="chip" style="--c:${c.color}" data-id="${c.id}" aria-pressed="${c.id===selCat}"><i class="dot"></i>${esc(c.name)}</button>`).join('');
}

/* ---------- 음성 인식 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if(!SR){
  $('#micHint').textContent = /iPhone|iPad/.test(navigator.userAgent)
    ? '이 화면에서는 음성 인식을 쓸 수 없습니다. Safari로 열거나, 위 칸을 누르고 키보드의 마이크로 말한 뒤 완료(Enter)를 누르세요.'
    : '이 브라우저는 음성 인식을 지원하지 않습니다. Chrome이나 Edge에서 열거나, 위 칸에 문장을 입력하고 Enter를 누르세요.';
  $('#micBtn').disabled = true; $('#micBtn').style.opacity = .4;
}else{
  rec = new SR(); rec.lang='ko-KR'; rec.interimResults=true; rec.continuous=false;
  let heard='', parsed=false;
  rec.onresult = e=>{
    let txt=''; let final=false;
    for(const r of e.results){ txt += r[0].transcript; if(r.isFinal) final=true; }
    heard = txt; $('#sentence').value = txt;
    if(final){ parsed=true; applyParsed(parseSentence(txt), txt); }
  };
  rec.onend = ()=>{
    listening=false; $('#micBtn').classList.remove('on'); $('#micBtn').setAttribute('aria-label','음성 입력 시작');
    // iPhone Safari는 최종 결과 표시 없이 끝나기도 해서, 들은 문장이 있으면 여기서 해석
    if(!parsed && heard.trim()) applyParsed(parseSentence(heard), heard);
  };
  rec.onstart = ()=>{ heard=''; parsed=false; };
  rec.onerror = e=>{
    const msg = {'not-allowed':'마이크 권한이 거부되었습니다. 주소창의 마이크 아이콘에서 허용해 주세요.','no-speech':'음성이 들리지 않았습니다. 다시 눌러 말해 주세요.','network':'음성 인식에 인터넷 연결이 필요합니다.'}[e.error] || '음성 인식 오류: '+e.error;
    toast(msg);
  };
  $('#micBtn').onclick = ()=>{
    if(listening){ rec.stop(); return; }
    try{ rec.start(); listening=true; $('#micBtn').classList.add('on'); $('#micBtn').setAttribute('aria-label','음성 입력 중지'); $('#sentence').value=''; $('#sentence').placeholder='듣는 중… 예: 배달 음식 15,000원'; }catch(err){}
  };
}

  }

  for(const e of list){ const k=dayKey(new Date(e.ts)); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e); }

  for(const [k,items] of groups){

    }
    html += `</div>`;
  }
  $('#list').innerHTML = html;
  const m = new Date(); const mSum = state.entries.filter(e=>{const d=new Date(e.ts);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth();}).reduce((s,e)=>s+e.amount,0);

/* ---------- 통계 ---------- */
let unit='month', anchor=new Date(), chart=null;
function rangeOf(u, a){
  const s = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  if(u==='day'){ const e=new Date(s); e.setDate(s.getDate()+1); return [s,e]; }
  if(u==='week'){ const off=(s.getDay()+6)%7; s.setDate(s.getDate()-off); const e=new Date(s); e.setDate(s.getDate()+7); return [s,e]; }
  if(u==='month'){ const st=new Date(a.getFullYear(),a.getMonth(),1); return [st,new Date(a.getFullYear(),a.getMonth()+1,1)]; }
  const st=new Date(a.getFullYear(),0,1); return [st,new Date(a.getFullYear()+1,0,1)];
}
function shift(u,a,dir){ const d=new Date(a); if(u==='day') d.setDate(d.getDate()+dir); else if(u==='week') d.setDate(d.getDate()+7*dir); else if(u==='month') d.setMonth(d.getMonth()+dir,1); else d.setFullYear(d.getFullYear()+dir); return d; }
function inRange([s,e]){ return state.entries.filter(x=>{const t=new Date(x.ts); return t>=s && t<e;}); }
function label(u,[s,e]){
  if(u==='day') return `${s.getFullYear()}.${s.getMonth()+1}.${s.getDate()} (${WD[s.getDay()]})`;
  if(u==='week'){ const l=new Date(e); l.setDate(e.getDate()-1); return `${s.getMonth()+1}.${s.getDate()} – ${l.getMonth()+1}.${l.getDate()}`; }
  if(u==='month') return `${s.getFullYear()}년 ${s.getMonth()+1}월`;
  return `${s.getFullYear()}년`;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function renderStats(){
  document.querySelectorAll('#unitTabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.unit===unit));
  const r = rangeOf(unit, anchor), pr = rangeOf(unit, shift(unit, anchor, -1));
  const cur = inRange(r), prev = inRange(pr);
  const total = cur.reduce((s,x)=>s+x.amount,0), ptotal = prev.reduce((s,x)=>s+x.amount,0);
  $('#pLabel').textContent = label(unit, r);
  $('#nextP').disabled = r[1] > new Date();

  // KPI
  const now=new Date(); const elapsedEnd = r[1]>now ? now : r[1];
  const days = Math.max(1, Math.ceil((elapsedEnd - r[0])/864e5));
  const diff = ptotal ? (total-ptotal)/ptotal*100 : null;
  const prevName = {day:'전날',week:'지난주',month:'지난달',year:'작년'}[unit];
  const topCat = topCats(cur)[0];
  $('#kpis').innerHTML = `
    <div class="kpi"><div class="k">총 지출</div><div class="v">${won(total)}</div></div>
    <div class="kpi"><div class="k">${prevName} 대비</div><div class="v">${diff===null?'—':`<span class="pill ${diff>0?'up':'down'}">${diff>0?'▲':'▼'} ${Math.abs(diff).toFixed(0)}%</span>`}</div><div class="k num">${prevName} ${won(ptotal)}</div></div>
    <div class="kpi"><div class="k">${unit==='day'?'기록 건수':'하루 평균'}</div><div class="v">${unit==='day'?cur.length+'건':won(total/days)}</div></div>
    <div class="kpi"><div class="k">가장 많이 쓴 곳</div><div class="v">${topCat?esc(topCat.c.name):'—'}</div>${topCat?`<div class="k num">${(topCat.sum/total*100).toFixed(0)}%</div>`:''}</div>`;

  // 메인 차트
  let labels=[], data=[], pdata=[], title='';
  const bucket = (arr, n, f) => { const b=Array(n).fill(0); arr.forEach(x=>b[f(new Date(x.ts))]+=x.amount); return b; };
  if(unit==='day'){ labels=[...Array(24)].map((_,h)=>h+'시'); data=bucket(cur,24,t=>t.getHours()); title='시간대별 지출'; }
  if(unit==='week'){ labels=['월','화','수','목','금','토','일']; data=bucket(cur,7,t=>(t.getDay()+6)%7); pdata=bucket(prev,7,t=>(t.getDay()+6)%7); title='요일별 지출 (회색: 지난주)'; }
  if(unit==='month'){
    const nd=new Date(r[0].getFullYear(),r[0].getMonth()+1,0).getDate(); labels=[...Array(nd)].map((_,i)=>i+1+'일');
    const daily=bucket(cur,nd,t=>t.getDate()-1); const pd=new Date(pr[0].getFullYear(),pr[0].getMonth()+1,0).getDate(); const pdaily=bucket(prev,Math.max(pd,nd),t=>t.getDate()-1);
    let acc=0; data=daily.map((v,i)=>{ const d=new Date(r[0].getFullYear(),r[0].getMonth(),i+1); acc+=v; return d>now?null:acc; });
    let pacc=0; pdata=pdaily.slice(0,nd).map(v=>pacc+=v); title='누적 지출 (회색: 지난달 같은 날까지)';
  }
  if(unit==='year'){ labels=[...Array(12)].map((_,i)=>i+1+'월'); data=bucket(cur,12,t=>t.getMonth()); pdata=bucket(prev,12,t=>t.getMonth()); title='월별 지출 (회색: 작년)'; }
  $('#mainTitle').textContent = title;
  drawChart(labels, data, pdata, unit==='month' ? 'line' : 'bar');

  // 카테고리
  const cats = topCats(cur);
  $('#catBreak').innerHTML = !total ? `<div class="empty">이 기간에 기록이 없습니다</div>` :
    `<div class="share">${cats.map(x=>`<span style="--c:${x.c.color};width:${x.sum/total*100}%" title="${esc(x.c.name)}"></span>`).join('')}</div>` +
    cats.map(x=>{ const ps = prev.filter(p=>p.catId===x.c.id).reduce((s,p)=>s+p.amount,0); const dd = ps? (x.sum-ps)/ps*100 : null;
      return `<div class="catrow" style="--c:${x.c.color}"><i class="dot"></i><span>${esc(x.c.name)} <span class="meta">${x.n}건 · ${(x.sum/total*100).toFixed(0)}%${dd===null?'':` · ${prevName} ${dd>0?'+':''}${dd.toFixed(0)}%`}</span></span><span class="num">${won(x.sum)}</span><div class="bar"><i style="width:${x.sum/cats[0].sum*100}%"></i></div></div>`; }).join('');

  // 두 번째 패널
  const sp = $('#secondPanel');
  if(unit==='month'){ sp.hidden=false; $('#secondTitle').textContent='날짜별 지출 달력'; $('#secondBody').innerHTML = calendar(r[0], cur); }
  else if(unit==='year'){ sp.hidden=false; $('#secondTitle').textContent='카테고리 × 월'; $('#secondBody').innerHTML = catMonthHeat(cur, cats); }
  else if(unit==='week'){ sp.hidden=false; $('#secondTitle').textContent='요일 × 카테고리'; $('#secondBody').innerHTML = weekStack(cur, cats); }
  else { sp.hidden=false; $('#secondTitle').textContent='이날의 기록'; $('#secondBody').innerHTML = cur.length ? `<ol class="top">${[...cur].sort((a,b)=>a.ts.localeCompare(b.ts)).map(x=>{const t=new Date(x.ts);return `<li><span><span class="num">${pad(t.getHours())}:${pad(t.getMinutes())}</span> ${esc(catById(x.catId).name)} <small>${esc(x.memo||'')}</small></span><span class="num">${won(x.amount)}</span></li>`}).join('')}</ol>` : `<div class="empty">기록 없음</div>`; }

  // TOP 5
  const top=[...cur].sort((a,b)=>b.amount-a.amount).slice(0,5);
  $('#topList').innerHTML = top.length ? top.map(x=>{const t=new Date(x.ts);return `<li><span><span class="dot" style="--c:${catById(x.catId).color};display:inline-block;margin-right:6px"></span>${esc(catById(x.catId).name)} <small>${esc(x.memo||'')} · ${t.getMonth()+1}/${t.getDate()}</small></span><span class="num">${won(x.amount)}</span></li>`}).join('') : `<li><span class="empty" style="padding:8px 0">기록 없음</span><span></span></li>`;
}
function topCats(arr){
  const m=new Map(); arr.forEach(x=>{ const o=m.get(x.catId)||{c:catById(x.catId),sum:0,n:0}; o.sum+=x.amount; o.n++; m.set(x.catId,o); });
  return [...m.values()].sort((a,b)=>b.sum-a.sum);
}
function drawChart(labels, data, pdata, type){
  const fg=css('--muted'), line=css('--line'), acc=css('--accent');
  if(chart) chart.destroy();
  if(!window.Chart){ $('#mainChart').parentElement.innerHTML='<div class="empty">차트 라이브러리를 불러오지 못했습니다 (인터넷 연결 확인)</div>'; return; }
  const ds = [];
  if(pdata && pdata.length) ds.push({label:'이전', data:pdata, backgroundColor:line, borderColor:fg+'88', borderWidth: type==='line'?1.5:0, borderDash: type==='line'?[4,4]:[], pointRadius:0, borderRadius:4, order:2});
  ds.push({label:'이번', data, backgroundColor: type==='line' ? acc+'22' : acc, borderColor:acc, borderWidth: type==='line'?2.5:0, fill: type==='line', pointRadius:0, borderRadius:4, tension:.25, order:1, spanGaps:false});
  chart = new Chart($('#mainChart'), {type, data:{labels, datasets:ds}, options:{
    responsive:true, maintainAspectRatio:false, animation:{duration:300},
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${won(c.parsed.y||0)}`}}},
    scales:{x:{grid:{display:false},ticks:{color:fg,maxRotation:0,autoSkip:true,maxTicksLimit:12},stacked:false},
            y:{beginAtZero:true,grid:{color:line},border:{display:false},ticks:{color:fg,callback:v=>shortWon(v)}}}
  }});
}
function heatColor(v,max){ if(!v) return 'var(--bg)'; const p = Math.min(1, v/max); return `color-mix(in srgb, var(--accent) ${Math.round(15+p*75)}%, var(--surface))`; }
function calendar(first, arr){
  const y=first.getFullYear(), m=first.getMonth(), nd=new Date(y,m+1,0).getDate();
  const daily=Array(nd+1).fill(0); arr.forEach(x=>daily[new Date(x.ts).getDate()]+=x.amount);
  const max=Math.max(...daily,1); const lead=(first.getDay()+6)%7; const today=new Date();
  let h='<div class="cal">'+['월','화','수','목','금','토','일'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++) h+='<div class="cell blank"></div>';
  for(let d=1; d<=nd; d++){
    const v=daily[d]; const strong=v/max>.55;
    const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
    h+=`<div class="cell${isToday?' today':''}" style="background:${heatColor(v,max)};${strong?'color:var(--surface)':''}" title="${m+1}/${d} ${won(v)}"><b>${d}</b><span>${v?shortWon(v):''}</span></div>`;
  }
  h+='</div><div class="legend">적음 '+[0,.25,.5,.75,1].map(p=>`<i style="background:${heatColor(p?p*max:0,max)}"></i>`).join('')+' 많음</div>';
  return h;
}
function catMonthHeat(arr, cats){
  if(!cats.length) return '<div class="empty">기록 없음</div>';
  const grid = cats.map(c=>{ const row=Array(12).fill(0); arr.filter(x=>x.catId===c.c.id).forEach(x=>row[new Date(x.ts).getMonth()]+=x.amount); return {c:c.c,row}; });
  const max=Math.max(...grid.flatMap(g=>g.row),1);
  return `<div style="overflow-x:auto"><table style="border-collapse:separate;border-spacing:3px;font-size:11px;width:100%;min-width:420px"><tr><th></th>${[...Array(12)].map((_,i)=>`<th style="color:var(--muted);font-weight:400">${i+1}</th>`).join('')}</tr>`+
    grid.map(g=>`<tr><td style="white-space:nowrap;padding-right:6px">${esc(g.c.name)}</td>${g.row.map((v,i)=>`<td title="${esc(g.c.name)} ${i+1}월 ${won(v)}" style="height:22px;border-radius:4px;background:${heatColor(v,max)}"></td>`).join('')}</tr>`).join('')+'</table></div>';
}
function weekStack(arr, cats){
  if(!cats.length) return '<div class="empty">기록 없음</div>';
  const days=[...Array(7)].map(()=>new Map()); arr.forEach(x=>{const i=(new Date(x.ts).getDay()+6)%7; days[i].set(x.catId,(days[i].get(x.catId)||0)+x.amount);});
  const sums=days.map(m=>[...m.values()].reduce((a,b)=>a+b,0)); const max=Math.max(...sums,1);
  return days.map((m,i)=>`<div class="catrow" style="grid-template-columns:24px minmax(0,1fr) auto"><span>${'월화수목금토일'[i]}</span><div class="share" style="margin:0;height:14px;width:${sums[i]/max*100}%">${cats.filter(c=>m.get(c.c.id)).map(c=>`<span style="--c:${c.c.color};width:${m.get(c.c.id)/sums[i]*100}%" title="${esc(c.c.name)} ${won(m.get(c.c.id))}"></span>`).join('')}</div><span class="num" style="font-size:12px">${sums[i]?shortWon(sums[i]):''}</span></div>`).join('');
}
document.querySelectorAll('#unitTabs button').forEach(b=>b.onclick=()=>{ unit=b.dataset.unit; renderStats(); });
$('#prevP').onclick=()=>{ anchor=shift(unit,anchor,-1); renderStats(); };
$('#nextP').onclick=()=>{ anchor=shift(unit,anchor,1); renderStats(); };
$('#thisP').onclick=()=>{ anchor=new Date(); renderStats(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(!$('#view-stats').hidden) renderStats(); });

  const t=new Date(); $('#todayLabel').textContent = `${t.getMonth()+1}월 ${t.getDate()}일 ${WD[t.getDay()]}요일`;
  renderChips(); renderCatList(); renderList(); setNow();
}
initAll();
